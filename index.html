<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PV Zuhause</title>
<meta name="description" content="Live-Daten der PV-Anlage: Erzeugung, Verbrauch, Batterie und Netz.">
<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PV">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #F5F5F7; --card: #FFFFFF; --ink: #1D1D1F; --ink2: #6E6E73; --ink3: #8E8E93;
  --line: #D2D2D7; --grid: #E8E8ED; --accent: #0071E3; --panel: #E8F2FE;
  --pv: #E8A100; --house: #0071E3; --bat: #12A08A; --net: #8E8E93;
  --ok: #27AE60; --warn: #E67E22; --bad: #E74C3C;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --ink: #F5F5F7; --ink2: #A1A1A6; --ink3: #8E8E93;
    --line: #38383A; --grid: #2C2C2E; --accent: #3D8EEB; --panel: #0B2A4A;
    --pv: #B98000; --house: #3D8EEB; --bat: #16A08A; --net: #8E8E93;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --ink: #F5F5F7; --ink2: #A1A1A6; --ink3: #8E8E93;
  --line: #38383A; --grid: #2C2C2E; --accent: #3D8EEB; --panel: #0B2A4A;
  --pv: #B98000; --house: #3D8EEB; --bat: #16A08A; --net: #8E8E93;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 16px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom));
}
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px; }
header { display: flex; align-items: flex-end; justify-content: space-between; padding: 20px 0 12px; }
h1 { font: 700 32px/1.1 -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif; letter-spacing: -0.02em; margin: 0; }
h2 { font-size: 20px; letter-spacing: -0.01em; margin: 28px 0 10px; }
.sub { color: var(--ink2); font-size: 14px; }
.icon-btn { border: 0; background: var(--card); color: var(--ink); width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.card { background: var(--card); border-radius: var(--r); padding: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.tile .lab { display: flex; align-items: center; gap: 8px; color: var(--ink2); font-size: 14px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.tile .val { font: 600 30px/1.15 -apple-system, "SF Pro Display", sans-serif; letter-spacing: -0.02em; margin-top: 6px; font-variant-numeric: tabular-nums; }
.tile .val small { font-size: 17px; font-weight: 500; color: var(--ink2); margin-left: 2px; }
.tile .note { color: var(--ink2); font-size: 13px; margin-top: 2px; }
.kpi .val { font-size: 22px; }
.flowcard { padding: 6px 4px 2px; }
.flow-svg { display: block; width: 100%; max-width: 420px; margin: 0 auto; overflow: visible; }
.flow-svg .flow { fill: none; stroke-linecap: round; stroke-dasharray: 0.1 14; animation: flowdash linear infinite; }
@keyframes flowdash { from { stroke-dashoffset: 14.1; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) { .flow-svg .flow { animation: none; stroke-dasharray: none; opacity: .6; } }
.flow-svg .fl-val { font: 600 20px -apple-system, "SF Pro Display", sans-serif; fill: var(--ink); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.flow-svg .fl-unit { font-size: 13px; font-weight: 500; fill: var(--ink2); }
.flow-svg .fl-lab { font-size: 12px; fill: var(--ink2); }
.summary { font-size: 17px; line-height: 1.5; margin: 14px 2px 0; color: var(--ink); }
.socbar { height: 8px; background: var(--grid); border-radius: 4px; margin-top: 10px; overflow: hidden; }
.socbar > i { display: block; height: 100%; background: var(--bat); border-radius: 4px; }
.banner { border-radius: 12px; padding: 10px 14px; font-size: 14px; margin: 0 0 12px; display: flex; gap: 8px; align-items: flex-start; }
.banner.warn { background: color-mix(in srgb, var(--warn) 14%, var(--card)); }
.banner.info { background: var(--panel); }
.foot { color: var(--ink3); font-size: 13px; text-align: center; margin: 24px 0 8px; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px;
  background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button {
  flex: 1; max-width: 160px; border: 0; background: none; color: var(--ink3); font: 500 11px/1.2 inherit;
  display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; cursor: pointer;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--accent); }
.daynav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 12px; }
.daynav b { font-size: 17px; }
.daynav button { border: 0; background: var(--card); color: var(--accent); width: 38px; height: 38px; border-radius: 50%; font-size: 20px; cursor: pointer; }
.daynav button:disabled { color: var(--ink3); opacity: .4; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; touch-action: pan-y; }
.chart text { fill: var(--ink3); font-size: 11px; font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink2); margin: 10px 2px 0; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.tip {
  position: absolute; top: 0; pointer-events: none; background: var(--card); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.5;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); white-space: nowrap; display: none; z-index: 2; font-variant-numeric: tabular-nums;
}
.tip b { display: block; margin-bottom: 2px; }
.tip .row { display: flex; align-items: center; gap: 6px; }
.tip .row span:last-child { margin-left: auto; padding-left: 12px; font-weight: 600; }
table.data { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.data th { text-align: right; color: var(--ink2); font-weight: 500; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.data td { text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--grid); }
table.data th:first-child, table.data td:first-child { text-align: left; }
details summary { color: var(--accent); cursor: pointer; font-size: 14px; margin-top: 12px; }
/* Formulare */
.auth { max-width: 380px; margin: 10vh auto 0; padding: 0 16px; }
.auth h1 { margin-bottom: 6px; }
label.f { display: block; font-size: 13px; color: var(--ink2); margin: 14px 0 6px; }
input.f { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
input.f:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.btn { display: block; width: 100%; border: 0; border-radius: 980px; background: var(--accent); color: #fff; font: 600 17px/1 inherit; padding: 15px; margin-top: 20px; cursor: pointer; }
.btn.ghost { background: none; color: var(--accent); font-weight: 500; font-size: 15px; padding: 10px; margin-top: 8px; }
.btn.small { display: inline-block; width: auto; padding: 8px 14px; font-size: 14px; margin: 0; }
.btn.danger { background: none; color: var(--bad); }
.err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; }
.list .item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--grid); }
.list .item:last-child { border-bottom: 0; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 980px; background: var(--grid); color: var(--ink2); }
.hidden { display: none !important; }
.loading { color: var(--ink2); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">Wird geladen …</div></div>
<nav class="tabs hidden" id="tabs">
  <button data-tab="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Jetzt</button>
  <button data-tab="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg>Tag</button>
  <button data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Monat</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profil</button>
</nav>
<script src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
